    <style>
      :root {
        --hospital-blue: #087f8c;
        --hospital-dark: #075e70;
        --hospital-light: #e8f7f8;
        --hospital-ink: #17324d;
      }

      body.login {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #e8f7f8 0%, #f7fbfc 52%, #dff1f5 100%);
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      body.login:before {
        content: "";
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 7px;
        background: var(--hospital-blue);
      }

      .login_wrapper {
        width: 420px;
        max-width: calc(100% - 32px);
        margin: 0 auto;
        padding-top: 9vh;
      }

      .login_form {
        width: 100%;
      }

      .login_content {
        padding: 38px 40px 32px;
        background: #fff;
        border: 1px solid #d7e8eb;
        border-top: 5px solid var(--hospital-blue);
        border-radius: 10px;
        box-shadow: 0 14px 35px rgba(7, 94, 112, .14);
      }

      .login_content:before {
        content: "";
        display: block;
        width: 82px;
        height: 82px;
        margin: 0 auto 16px;
        background: url("<?=_DEFAULT_URL_?>images/logo.png") center / contain no-repeat;
      }

      .login_content h1 {
        color: var(--hospital-ink);
        font-size: 23px;
        font-weight: 600;
        margin: 0 0 7px;
        text-align: center;
      }

      .login_content h1:after {
        content: "Bệnh viện Thống Nhất";
        display: block;
        margin-top: 7px;
        color: #6c8793;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: .4px;
      }

      .login_content > form > div {
        margin-bottom: 14px;
      }

      .login_content .form-control {
        height: 44px;
        border: 1px solid #cbdfe4;
        border-radius: 5px;
        padding: 10px 13px;
        color: var(--hospital-ink);
        box-shadow: none;
      }

      .login_content .form-control:focus {
        border-color: var(--hospital-blue);
        box-shadow: 0 0 0 3px rgba(8, 127, 140, .12);
      }

      .login_content .submit {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 5px;
        background: var(--hospital-blue);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        transition: background .2s ease, transform .2s ease;
      }

      .login_content .submit:hover {
        background: var(--hospital-dark);
        transform: translateY(-1px);
      }

      .login_content .separator {
        border-top: 1px solid #edf3f4;
        margin-top: 22px;
      }

      @media (max-width: 480px) {
        .login_wrapper {
          padding-top: 7vh;
        }
        .login_content {
          padding: 30px 24px 24px;
        }
      }
    </style>
