<style>
.password-strength { clear: both; padding-top: 8px; font-size: 13px; }
.password-strength__bar { display: block; width: 100%; height: 6px; margin-top: 6px; overflow: hidden; background: #e5e7eb; border-radius: 4px; }
.password-strength__bar span { display: block; width: 0; height: 100%; background: #dc3545; transition: width .2s ease, background-color .2s ease; }
.password-requirements { clear: both; margin: 8px 0 0; padding-left: 20px; color: #a94442; font-size: 13px; line-height: 1.7; }
.password-requirements li::marker { content: "✕  "; }
.password-requirements li.is-valid { color: #198754; }
.password-requirements li.is-valid::marker { content: "✓  "; }
.password-match-message { clear: both; padding-top: 7px; font-size: 13px; }
.password-match-message.is-valid { color: #198754; }
.password-match-message.is-invalid { color: #a94442; }
</style>

<script>
(function () {
	var password = document.getElementById('newpass');
	var confirmation = document.getElementById('verifypass');
	var strength = document.getElementById('password-strength');
	var strengthText = strength.querySelector('strong');
	var strengthBar = strength.querySelector('.password-strength__bar span');
	var matchMessage = document.getElementById('password-match-message');

	function evaluatePassword() {
		var value = password.value;
		var rules = {
			length: value.length > 8,
			uppercase: /[A-Z]/.test(value),
			number: /[0-9]/.test(value),
			special: /[^A-Za-z0-9]/.test(value)
		};
		var score = 0;

		Object.keys(rules).forEach(function (rule) {
			var item = document.querySelector('[data-rule="' + rule + '"]');
			item.classList.toggle('is-valid', rules[rule]);
			if (rules[rule]) score++;
		});

		var labels = ['Rất yếu', 'Rất yếu', 'Yếu', 'Trung bình', 'Mạnh'];
		var colors = ['#dc3545', '#dc3545', '#fd7e14', '#ffc107', '#198754'];
		strengthText.textContent = value === '' ? 'Chưa nhập' : labels[score];
		strengthText.style.color = colors[score];
		strengthBar.style.width = value === '' ? '0' : (score * 25) + '%';
		strengthBar.style.backgroundColor = colors[score];
		checkConfirmation();
	}

	function checkConfirmation() {
		if (confirmation.value === '') {
			matchMessage.textContent = '';
			matchMessage.className = 'password-match-message';
			return;
		}
		var matches = confirmation.value === password.value;
		matchMessage.textContent = matches ? 'Mật khẩu xác nhận đã khớp.' : 'Mật khẩu xác nhận chưa khớp.';
		matchMessage.className = 'password-match-message ' + (matches ? 'is-valid' : 'is-invalid');
	}

	password.addEventListener('input', evaluatePassword);
	confirmation.addEventListener('input', checkConfirmation);
}());
</script>
